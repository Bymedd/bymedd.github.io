<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gezi Rehberi · Dünya</title>
<style>
:root{--bg:#eaf1f7;--s1:#fff;--s2:#cfe0ee;--grid:rgba(20,50,90,.16);--tx:#10202f;--mut:#5c6f80;--pan:rgba(255,255,255,.9);--bd:rgba(20,50,90,.12);--ac:#e67e22;--chip:rgba(20,50,90,.07);--land:#eef2e6;--coast:rgba(40,70,100,.35);--tile:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b14;--s1:#1a2a47;--s2:#0b1424;--grid:rgba(160,190,230,.14);--tx:#eaf0f8;--mut:#94a5ba;--pan:rgba(16,24,40,.9);--bd:rgba(255,255,255,.1);--chip:rgba(255,255,255,.08);--land:#1e2d48;--coast:rgba(160,190,230,.3);--tile:dark}}
:root[data-theme="dark"]{--bg:#070b14;--s1:#1a2a47;--s2:#0b1424;--grid:rgba(160,190,230,.14);--tx:#eaf0f8;--mut:#94a5ba;--pan:rgba(16,24,40,.9);--bd:rgba(255,255,255,.1);--chip:rgba(255,255,255,.08);--land:#1e2d48;--coast:rgba(160,190,230,.3);--tile:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.pn{position:absolute;background:var(--pan);border:1px solid var(--bd);border-radius:16px;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
#side{left:12px;top:12px;bottom:12px;width:320px;display:flex;flex-direction:column;overflow:hidden;z-index:3}
#side h1{font-size:17px;margin:0;padding:14px 14px 2px}
#side .sub{padding:0 14px 8px;color:var(--mut);font-size:12px}
#q{margin:0 12px 8px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--chip);color:var(--tx);font:inherit;outline:none}
#chips{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.ch{flex:none;border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:20px;padding:5px 11px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.ch.on{background:var(--ac);color:#111;border-color:transparent}
#list{flex:1;overflow-y:auto;border-top:1px solid var(--bd)}
.it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border:0;border-bottom:1px solid var(--bd);background:none;color:inherit;font:inherit;cursor:pointer}
.it:hover,.it.sel{background:var(--chip)}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:17px}
.it b{display:block;font-size:13px}.it small{color:var(--mut);font-size:11px}.it .tx{flex:1;min-width:0}
.hr{color:var(--ac);font-size:13px}
#foot{padding:8px 14px;color:var(--mut);font-size:11px;border-top:1px solid var(--bd)}
#sheet{right:12px;top:12px;width:330px;max-height:calc(100% - 100px);overflow-y:auto;display:none;padding:16px;z-index:3}
#sheet h2{margin:0 0 4px;font-size:19px}
.tag{display:inline-block;padding:3px 9px;border-radius:12px;background:var(--chip);font-size:11px;margin:0 4px 4px 0}
.cat{font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0;color:var(--mut);font-size:12px}
.btns{display:flex;gap:8px;margin:12px 0}
.btn{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--chip);color:var(--tx);font:600 13px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--ac);color:#111;border-color:transparent}
.mut{color:var(--mut);font-size:12px}
.nb{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);cursor:pointer;font-size:13px}
#x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer}
#hud{left:50%;transform:translateX(-50%);bottom:12px;padding:7px 14px;font-size:12px;color:var(--mut);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#zb{right:12px;bottom:12px;display:flex;flex-direction:column;overflow:hidden;z-index:2}
#zb button{width:40px;height:40px;border:0;background:none;color:var(--tx);font-size:20px;cursor:pointer}
#tg{display:none;left:12px;top:12px;z-index:4;width:44px;height:44px;border:1px solid var(--bd);font-size:18px;color:var(--tx);cursor:pointer}
#vw{left:50%;top:12px;transform:translateX(-50%);display:flex;overflow:hidden;z-index:2}
#vt{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:1;background:var(--bg);transition:opacity .55s cubic-bezier(.4,0,.2,1)}
#vt.on{opacity:1}
#vw button{border:0;background:none;color:var(--mut);padding:9px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}
#vw button.on,#ly button.on{background:var(--ac);color:#111}
#ly{left:50%;top:58px;transform:translateX(-50%);display:none;overflow-x:auto;max-width:calc(100% - 24px);z-index:2;scrollbar-width:none}
#ly button{flex:none;border:0;background:none;color:var(--mut);padding:7px 11px;font:600 12px inherit;font-family:inherit;cursor:pointer}
@media(max-width:800px){
 #tg{display:block}
 #vw{left:64px;transform:none}
 #ly{left:12px;transform:none;top:62px}
 .map #hud{top:108px}
 #side{left:0;right:0;top:auto;bottom:0;width:auto;height:62%;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .3s}
 #side.open{transform:none}
 #sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-height:55%;border-radius:18px 18px 0 0}
 #zb{bottom:auto;top:12px}
 #hud{bottom:auto;top:62px}
}
</style>
</head>

<div id="app">
<canvas id="cv"></canvas>
<canvas id="vt"></canvas>
<button id="tg" class="pn" aria-label="Liste">☰</button>
<aside id="side" class="pn">

 <div id="chips"></div><div id="list"></div><div id="foot"></div>
</aside>
<section id="sheet" class="pn"><button id="x" aria-label="Kapat">×</button><div id="sc"></div></section>
<div id="hud" class="pn"></div>
<div id="ly" class="pn"></div>
<div id="vw" class="pn"><button data-v="globe">🌍 Globe</button><button data-v="map">🗺️ Harita</button></div>
<div id="zb" class="pn"><button id="zi" aria-label="Yakınlaştır">＋</button><button id="zo" aria-label="Uzaklaştır">－</button><button id="zr" aria-label="Dünya">🌍</button></div>
</div>

  if(mp&&(pg.b[2]+o<x0||pg.b[0]+o>x1||pg.b[3]<y0||pg.b[1]>y1))continue;
  ctx.beginPath();let any=false;
  for(const ring of pg.rings){let f=true;for(const[x,y]of ring){const q=PL(y,x+o);if(q.v)any=true;f?ctx.moveTo(q.x,q.y):ctx.lineTo(q.x,q.y);f=false}ctx.closePath()}
  if(any){ctx.fill('evenodd');ctx.stroke()}}}
// Harita altlıkları (API anahtarı gerektirmez) — legacy HTML'deki Google Maps karoları + CARTO açık/koyu.
// Yüklenemezse (izole/yayın ortamı) gömülü vektör dünya haritası görünür kalır.
const G=(l,i,x,y,z)=>`https://mt${i&3}.google.com/vt/lyrs=${l}&x=${x}&y=${y}&z=${z}`,C=(t,i,x,y,z)=>`https://${'abcd'[i&3]}.basemaps.cartocdn.com/${t}/${z}/${x}/${y}${devicePixelRatio>1?'@2x':''}.png`;
const LAYERS={m:{n:'🗺️ Harita',a:'© Google Maps',u:(i,x,y,z)=>G('m',i,x,y,z)},s:{n:'🛰️ Uydu',a:'© Google Maps',u:(i,x,y,z)=>G('s',i,x,y,z)},
 h:{n:'🌍 Hibrit',a:'© Google Maps',u:(i,x,y,z)=>G('h',i,x,y,z)},p:{n:'⛰️ Arazi',a:'© Google Maps',u:(i,x,y,z)=>G('p',i,x,y,z)},
 l:{n:'💡 Açık',a:'© CARTO © OpenStreetMap',u:(i,x,y,z)=>C('light_all',i,x,y,z)},d:{n:'🌙 Koyu',a:'© CARTO © OpenStreetMap',u:(i,x,y,z)=>C('dark_all',i,x,y,z)}};
let layer='m';try{const l=localStorage.getItem('layer');if(LAYERS[l])layer=l}catch(e){}
const TC=new Map();let rq=0;
function tile(u){let t=TC.get(u);if(!t){if(TC.size>500)TC.clear();t={ok:false,img:new Image()};
 t.img.onload=()=>{t.ok=true;tilesOk=1;if(!rq)rq=requestAnimationFrame(()=>{rq=0;draw()})};t.img.src=u;TC.set(u,t)}return t}
function drawTiles(g){if(!TILES)return;const r=R(),Z=Math.log2(r*2*Math.PI/256),tz=Math.max(0,Math.min(19,Math.floor(Z))),n=2**tz,ts=256*2**(Z-tz),
 cx=(V.lng+180)/360*n*ts,cy=(1-my(V.lat)/Math.PI)/2*n*ts;
 const x0=Math.floor((cx-W/2)/ts),x1=Math.floor((cx+W/2)/ts),y0=Math.max(0,Math.floor((cy-H/2)/ts)),y1=Math.min(n-1,Math.floor((cy+H/2)/ts));
 if((x1-x0+1)*(y1-y0+1)>90)return;
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
  const t=tile(LAYERS[layer].u(tx+ty,((tx%n)+n)%n,ty,tz));
  if(t.ok)ctx.drawImage(t.img,tx*ts-(cx-W/2),ty*ts-(cy-H/2),ts+.5,ts+.5)}}
function resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);draw()}
new ResizeObserver(resize).observe(cv);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);

// ——— etkileşim ———
const minZ=()=>view==='map'?Math.max(1.2,Math.log2(Math.max(W,H)/(2*Math.PI*50))):1.2;
const clampZ=z=>Math.max(minZ(),Math.min(17,z));
/* ── Akışkan Globe↔Harita geçişi ─────────────────────────────────────
   Canvas'ı snapshot olarak #vt'ye çizer, opacity ile crossfade yapar. */
function smoothSwitchView(toView,cb){
 if(_transitioning)return;
 _transitioning=true;
 const vt=$('#vt'),vc=$('#cv');
 // Anlık görüntüyü #vt'ye kopyala
 vt.width=vc.width;vt.height=vc.height;
 vt.style.width=vc.style.width||vc.clientWidth+'px';
 vt.style.height=vc.style.height||vc.clientHeight+'px';
 const vtx=vt.getContext('2d');
 vtx.drawImage(vc,0,0);
 // Overlay'i göster (anında)
 vt.style.transition='none';vt.style.opacity='1';
 // Yeni görünümü arka planda hazırla
 view=toView;
 if(toView==='map'){V.z=clampZ(V.z);V.lat=Math.max(-80,Math.min(80,V.lat))}
 $('#ly').style.display=toView==='map'?'flex':'none';
 $('#app').classList.toggle('map',toView==='map');
 lyr();
 document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v===toView));
 try{localStorage.setItem('view',toView)}catch(e){}
 draw(); // yeni projeksiyon çizildi
 // Şimdi overlay'i fade-out yap
 requestAnimationFrame(()=>{
  vt.style.transition='opacity .6s cubic-bezier(.4,0,.2,1)';
  vt.style.opacity='0';
  const done=()=>{_transitioning=false;vt.removeEventListener('transitionend',done);if(cb)cb()};
  vt.addEventListener('transitionend',done)})}

function fly(lat,lng,z,ms=1100){
 cancelAnimationFrame(anim);
 const a={...V},dl=((lng-a.lng+540)%360)-180,t0=performance.now();
 const targetZ=clampZ(z);
 /* Hangi geçişin gerektiğini başlangıçta hesapla */
 const needToMap =view==='globe'&&targetZ>=AUTO_TO_MAP&&a.z<AUTO_TO_MAP;
 const needToGlobe=view==='map'  &&targetZ<=AUTO_TO_GLOBE&&a.z>AUTO_TO_GLOBE;
 /* Geçiş zoom noktası: hangi %'de view switch olmalı */
 const switchFrac=needToMap  ?(AUTO_TO_MAP  -a.z)/(targetZ-a.z)
                 :needToGlobe?(AUTO_TO_GLOBE-a.z)/(targetZ-a.z):null;
 let switched=false;
 const step=t=>{
  const raw=(t-t0)/ms,k=Math.min(1,raw),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  V.lng=a.lng+dl*e;V.lat=a.lat+(lat-a.lat)*e;V.z=a.z+(targetZ-a.z)*e;
  /* Eşiği geçtik mi? */
  if(switchFrac!==null&&!switched&&k>=switchFrac){
   switched=true;
   const toV=needToMap?'map':'globe';
   smoothSwitchView(toV)}
  else if(!_transitioning)draw();
  if(k<1)anim=requestAnimationFrame(step)};
 anim=requestAnimationFrame(step)}
const ptr=new Map();let moved=0,pd=0;const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;cancelAnimationFrame(anim);if(ptr.size==2)pd=dist()});
cv.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId)){cv.style.cursor=near(e)?'pointer':'grab';return}
 const o=ptr.get(e.pointerId),n=[e.clientX,e.clientY];ptr.set(e.pointerId,n);
 if(ptr.size==1){const dx=n[0]-o[0],dy=n[1]-o[1],r=R();moved+=Math.abs(dx)+Math.abs(dy);
  if(view==='map'){V.lng-=dx/r/D;V.lat=Math.max(-80,Math.min(80,(2*Math.atan(Math.exp(my(V.lat)+dy/r))-Math.PI/2)/D))}
  else{V.lng-=dx/(r*Math.max(.2,Math.cos(V.lat*D)))/D;V.lat=Math.max(-85,Math.min(85,V.lat+dy/r/D))}
  V.lng=((V.lng+540)%360)-180}
 else if(ptr.size==2){const d=dist();if(pd)V.z=clampZ(V.z+Math.log2(d/pd));pd=d;moved+=9}
 draw()});
const end=e=>{if(ptr.size==1&&moved<6)click(e);ptr.delete(e.pointerId);pd=0};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);pd=0});
cv.addEventListener('wheel',e=>{
 e.preventDefault();
 const prev=V.z;
 V.z=clampZ(V.z-e.deltaY*.0022);
 /* Otomatik görünüm geçişi — wheel ile zoom eşiği aşılırsa */
 if(!_transitioning){
  if(view==='globe'&&prev<AUTO_TO_MAP&&V.z>=AUTO_TO_MAP)smoothSwitchView('map');
  else if(view==='map'&&prev>AUTO_TO_GLOBE&&V.z<=AUTO_TO_GLOBE)smoothSwitchView('globe');
  else draw();
 }},{passive:false});
function near(e){const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;let best=null,bd=1e9;
 for(const h of hits){const d=Math.hypot(h.x-x,h.y-y);if(d<h.r+6&&d<bd){bd=d;best=h.it}}return best}
function click(e){const it=near(e);if(!it)return;
 /* Ülke seçimi → z=5.2 ile AUTO_TO_MAP(4.8) eşiğini aşar → otomatik haritaya geç */
 if(it.k==='place')openPlace(it);else fly(it.lat,it.lng,it.k==='country'?5.2:it.k==='city'?7.6:11.2)}
$('#zi').onclick=()=>fly(V.lat,V.lng,V.z+1,400);$('#zo').onclick=()=>fly(V.lat,V.lng,V.z-1,400);
const home=()=>view==='map'?fly(22,12,minZ()+.15,1200):fly(30,25,2.6,1400);
$('#zr').onclick=()=>{closeSheet();home()};
function lyr(){$('#ly').innerHTML=Object.entries(LAYERS).map(([k,l])=>`<button data-k="${k}" class="${k===layer?'on':''}">${l.n}</button>`).join('')}
$('#ly').onclick=e=>{const k=e.target.dataset.k;if(k&&LAYERS[k]){layer=k;tilesOk=0;try{localStorage.setItem('layer',k)}catch(x){}lyr();draw()}};
function setView(v,animate){
 if(animate&&v!==view){smoothSwitchView(v);return}
 view=v;$('#ly').style.display=v==='map'?'flex':'none';$('#app').classList.toggle('map',v==='map');lyr();
 document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 try{localStorage.setItem('view',v)}catch(e){}
 if(v==='map'){V.z=clampZ(V.z);V.lat=Math.max(-80,Math.min(80,V.lat))}draw()}
$('#vw').onclick=e=>{
 const v=e.target.dataset.v;
 if(v&&v!==view){
  cancelAnimationFrame(anim);
  if(v==='map'&&V.z<AUTO_TO_MAP){
   /* Globe'dan haritaya: önce yaklaş, geçiş otomatik olsun */
   fly(V.lat,V.lng,AUTO_TO_MAP+.2,900);
  } else if(v==='globe'&&V.z>AUTO_TO_GLOBE){
   /* Haritadan globe'a: önce uzaklaş */
   fly(V.lat,V.lng,AUTO_TO_GLOBE-.2,900);
  } else {
   setView(v,true);
   if(v==='map'&&V.z<minZ()+.1)home()
  }
 }};
$('#tg').onclick=()=>$('#side').classList.toggle('open');

// ——— liste, filtre, detay ———
const money=n=>n===0?'Ücretsiz':'$'.repeat(n),dur=m=>m>=60?(m/60).toFixed(m%60?1:0).replace('.',',')+' sa':m+' dk';
const km=(a,b)=>{const p=(b.lat-a.lat)*D,l=(b.lng-a.lng)*D,h=Math.sin(p/2)**2+Math.cos(a.lat*D)*Math.cos(b.lat*D)*Math.sin(l/2)**2;return 12742*Math.asin(Math.sqrt(h))};
function chips(){const c=[['all','Tümü'],...ROOTS.map(r=>[r.slug,r.icon+' '+r.name.split(' ')[0]]),['fav','♥ Favoriler']];
 $('#chips').innerHTML=c.map(([k,n])=>`<button class="ch ${(k==='fav'?onlyFav:!onlyFav&&root===k)?'on':''}" data-k="${k}">${esc(n)}</button>`).join('')}
function list(){const a=DB.places.filter(match).sort((x,y)=>(y.feat?1:0)-(x.feat?1:0)||x.name.localeCompare(y.name,'tr'));
 $('#list').innerHTML=a.map(p=>{const c=CAT[p.cat],ci=CITY[p.country+'/'+p.city];
  return`<button class="it ${sel&&sel.id===p.id?'sel':''}" data-id="${p.id}"><span class="ic" style="background:${c.color}33">${c.icon}</span><span class="tx"><b>${esc(p.name)}</b><small>${esc(ci?ci.name:CTRY[p.country].name)} · ${esc(c.name)}</small></span>${favs.has(p.id)?'<span class="hr">♥</span>':''}</button>`}).join('')||'<div class="mut" style="padding:20px">Sonuç yok.</div>';
 $('#foot').textContent=`${a.length} mekan · ${DB.source} · ${DB.generated_at}`}
$('#chips').onclick=e=>{const k=e.target.dataset.k;if(!k)return;onlyFav=k==='fav';if(!onlyFav)root=k;chips();list();draw()};
$('#q').oninput=e=>{query=norm(e.target.value.trim());list();draw()};
$('#list').onclick=e=>{const b=e.target.closest('.it');if(b){openPlace(DB.places.find(p=>p.id==b.dataset.id));$('#side').classList.remove('open')}};
function openPlace(p){sel=p;const c=CAT[p.cat],ci=CITY[p.country+'/'+p.city],co=CTRY[p.country];
 const nb=DB.places.filter(o=>o!==p).map(o=>[o,km(p,o)]).filter(x=>x[1]<=5).sort((a,b)=>a[1]-b[1]).slice(0,5);
 $('#sc').innerHTML=`<h2>${esc(p.name)}</h2><div><span class="cat" style="color:${c.color}">${c.icon} ${esc(c.name)}</span> <span class="mut">· ${esc(co.flag)} ${esc(co.name)}${ci?' › '+esc(ci.name):''}</span></div>
 <p>${esc(p.desc)}</p>
 <div class="facts"><span>⭐ ${p.reviews?p.rating+' ('+p.reviews+')':'Henüz puan yok'}</span>${p.mins?`<span>⏱ ${dur(p.mins)}</span>`:''}<span>💳 ${money(p.price)}</span>${p.feat?'<span>✨ Öne çıkan</span>':''}</div>
 <div>${p.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
 <div class="btns"><button class="btn pri" id="fb">${favs.has(p.id)?'♥ Favoride':'♡ Favori'}</button>
 <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">🧭 Yol tarifi</a></div>
 <div class="mut" style="margin-bottom:10px">📷 Fotoğraflar · ▶ Videolar · 💬 Yorumlar — API bağlandığında burada görünecek.</div>
 <b>Yakındaki yerler (5 km)</b>${nb.map(([o,d])=>`<div class="nb" data-id="${o.id}"><span>${CAT[o.cat].icon} ${esc(o.name)}</span><span class="mut">${d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km'}</span></div>`).join('')||'<div class="mut">Yakında kayıtlı yer yok.</div>'}
 <div class="mut" style="margin-top:10px">/${p.country}/${p.city||'-'}/${p.slug}</div>`;
 $('#sheet').style.display='block';
 $('#fb').onclick=()=>{favs.has(p.id)?favs.delete(p.id):favs.add(p.id);saveFav();openPlace(p);list()};
 $('#sc').querySelectorAll('.nb').forEach(n=>n.onclick=()=>openPlace(DB.places.find(x=>x.id==n.dataset.id)));
 fly(p.lat,p.lng,Math.max(V.z,p.mz+.5,12));list();
 try{history.replaceState(null,'',`#/${p.country}/${p.city||'-'}/${p.slug}`)}catch(e){}}
