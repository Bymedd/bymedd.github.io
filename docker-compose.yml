services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gezi-db
    environment:
      POSTGRES_USER: gezi
      POSTGRES_PASSWORD: gezi_dev_password
      POSTGRES_DB: gezi
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=1536MB
               -c work_mem=16MB -c maintenance_work_mem=256MB
               -c random_page_cost=1.1 -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gezi -d gezi"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
